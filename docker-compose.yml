# One-command startup for the whole stack: `docker compose up`.
#
#   web  → nginx on http://localhost:8080 — the UI, and the reverse proxy for /v1
#   api  → Express on http://localhost:5006 — migrates and seeds on boot
#   db   → postgres:16-alpine on localhost:5433
#
# The browser only ever talks to `web`, which proxies /v1 to `api` so everything is one
# origin. `api`'s port is published anyway, for curl and /v1/docs.
#
# This replaces the scaffolded MongoDB compose file (see FAQ, "MongoDB or switch to a
# relational database?"). The booking rule is an overlap *constraint*, and Postgres can
# express it declaratively via `EXCLUDE USING gist`; Mongo cannot, so the same guarantee
# would have to be reconstructed in application code. As a bonus the infrastructure got
# simpler, not harder — Mongo transactions need a single-node replica set with an
# automatic `rs.initiate()`, where Postgres needs an image and three env vars.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
      POSTGRES_DB: booking
    ports:
      # Published on 5433 so it does not collide with a Postgres already running on the
      # developer's machine. Inside the compose network the API still talks to 5432.
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # `pg_isready` against the real user and database rather than a bare port probe:
      # the official image briefly starts a throwaway server on a unix socket to run its
      # init scripts, and a port-only check can go green against a server that is about
      # to be shut down and restarted.
      test: ['CMD-SHELL', 'pg_isready -U booking -d booking']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  api:
    build:
      # Build context is the repository root, not backend/: the API imports
      # @booking/shared, which only resolves through the npm workspace link created at
      # the root. A backend-only context cannot see that package.
      context: .
      dockerfile: backend/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 5006
      DATABASE_URL: postgres://booking:booking@db:5432/booking
      # The browser reaches the API through the `web` service's reverse proxy, on the same
      # origin, so no cross-origin request is made in the compose setup at all. The
      # allow-list covers the other way to run the client — `npm run dev` on 5173 against
      # the published API port — which proxies server-side and so is also same-origin, but
      # a direct call to :5006 from that page would not be.
      CORS_ORIGIN: http://localhost:5173,http://localhost:8080
    ports:
      # Published so the API can be curl'd and `/v1/docs` opened directly. The frontend
      # container does not use this mapping; it talks to `api:5006` on the compose network.
      - '5006:5006'
    depends_on:
      db:
        # The API runs its migration on boot, so it must not start until Postgres is
        # genuinely accepting connections. `depends_on` without a condition only waits
        # for the container to be *created*, which is the classic version of this bug.
        condition: service_healthy

  web:
    # nginx serving the built SPA and reverse-proxying /v1 to `api`, so the browser only
    # ever talks to one origin (see frontend/nginx.conf). This is why apiClient's base URL
    # is empty and every request is relative.
    build:
      # Repository root again: the app imports @booking/shared for its Zod form schemas.
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - '8080:80'
    depends_on:
      # Ordering only, deliberately not `service_healthy`: nginx resolves `api` lazily, per
      # request, so the static app can serve immediately and the first API call succeeds as
      # soon as the API is up. Gating the whole UI on the API's readiness would make a slow
      # migration look like a broken frontend.
      - api

volumes:
  postgres-data:
