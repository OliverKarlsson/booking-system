version: "3.4"
services:
  app:
    image: minut-assignment-backend
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - PORT=5006
      - MONGO_URI=mongodb://db:27017
    ports:
      - '5006:5006'
    depends_on:
      - db
  db:
    image: "mongo:5.0.9"
    ports:
      - "27018:27017" # exposed as 27018 to avoid conflicts with other running mongo instances
